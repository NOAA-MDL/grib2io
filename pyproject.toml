[build-system]
requires = [
  "Cython>=3",
  "numpy",
  "scikit-build-core>=1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "grib2io"
dynamic = ["version"]
description = "Python interface to the NCEP G2C Library for reading/writing GRIB2 files."
authors = [
  { name = "Eric Engle", email = "eric.engle@noaa.gov" },
  { name = "Adam Schnapp", email = "adam.schnapp@noaa.gov" },
]
requires-python = ">=3.8,<3.15"
keywords = [
  "weather",
  "data-science",
  "numpy",
  "meteorology",
  "weather-data",
  "atmospheric-science",
  "grib2",
  "grib2-decoder",
  "grib2-encoder",
  "ncep",
]
readme = "README.md"
license = { text = "MIT" }
# FUTURE: license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "numpy",
  "pyproj",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '^(?P<value>\S+)\s*$'

[project.optional-dependencies]
xarray = [
  "xarray",
]
kerchunk = [
  "kerchunk",
  "numcodecs",
]
test = [
  "pytest",
  "s3fs",
  "dask",
  "distributed",
  "cython",
  "xarray",
  "kerchunk",
  "dask[complete]",
]
demo = [
  "xarray",
  "kerchunk",
  "virtualizarr",
  "matplotlib",
  "cartopy",
  "jupyterlab",
  "geoviews",
  "hvplot",
]
all = [
  "xarray",
  "kerchunk",
  "numcodecs",
  "virtualizarr",
  "matplotlib",
  "cartopy",
  "jupyterlab",
  "geoviews",
  "hvplot",
  "dask",
  "distributed",
  "cython",
  "pyproj",
  "pytest",
  "s3fs",
]

[project.entry-points."xarray.backends"]
grib2io = "grib2io.xarray_backend:GribBackendEntrypoint"

[project.entry-points."numcodecs.codecs"]
# Make the Zarr v2 / numcodecs GRIB2 codec auto-discoverable. numcodecs
# lazily loads codecs from this entry-point group the first time it sees an
# unknown codec ID (here "grib2io") in a ".zarray" compressor/filters, so a
# plain "xr.open_zarr" on a grib2io Kerchunk reference can decode GRIB2
# chunks without a prior "import grib2io.codecs".
grib2io = "grib2io.codecs:Grib2Codec"

[project.entry-points."zarr.codecs"]
grib2io = "grib2io.codecs:Grib2SerializerCodec"
"numcodecs.grib2io" = "grib2io.codecs:Grib2SerializerCodec"

[project.scripts]
grib2io = "grib2io.cli.main:main"

[project.urls]
Documentation = "https://noaa-mdl.github.io/grib2io"
Repository = "https://github.com/NOAA-MDL/grib2io"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
wheel.packages = ["src/grib2io"]
logging.level = "INFO"

# Include only the files and directories explicitly selected below.
sdist.inclusion-mode = "explicit"

# Equivalent to the include and graft directives from MANIFEST.in.
sdist.include = [
  "MANIFEST.in",
  "setup.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "VERSION",
  "create_docs.sh",
  "requirements.txt",

  # Files required by the CMake source build.
  "CMakeLists.txt",
  "cmake/**",

  # Equivalent to the MANIFEST.in graft directives.
  "docs/**",
  "src/ext/**",
  "src/grib2io/**",
]

# Equivalent to the prune and global-exclude directives from MANIFEST.in.
sdist.exclude = [
  "tests/**",
  "*.py[cod]",
  "*.c",
  "*.so",
  "*.DS_Store",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
ignore = [
  "D",    # Ignore all docstring-related rules (D prefix)
  # "E501", # Ignore line-too-long (handled by formatter)
  "F401", # Ignore unused imports
  "F811", # Ignore redefinition
]
select = ["E4", "E7", "E9", "F"] # Preserve Ruff < 0.16.0 rules
