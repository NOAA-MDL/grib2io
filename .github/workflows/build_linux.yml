name: Build and Test on Linux

on: [push, pull_request]

jobs:
  build-linux:

    name: py${{ matrix.python-version }}_cc=${{ matrix.ccompiler }}_interp=${{ matrix.interp }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CC: ${{ matrix.ccompiler }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        ccompiler: ["gcc-14"]
        interp: ["on", "off"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Ubuntu Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install cmake libopenjp2-7-dev libpng-dev libaec-dev

    - name: Install NCEPLIBS-g2c
      run: |
        wget https://github.com/NOAA-EMC/NCEPLIBS-g2c/archive/refs/tags/v1.8.0.tar.gz
        tar -xzvf v1.8.0.tar.gz
        cd NCEPLIBS-g2c-1.8.0
        mkdir build && cd build
        cmake -DUSE_Jasper=OFF -DUSE_OpenJPEG=ON -DUSE_PNG=ON -DUSE_AEC=ON -DBUILD_SHARED_LIBS=ON ..
        make -j2
        sudo make install

    - name: Install NCEPLIBS-ip
      if: matrix.interp == 'on'
      run: |
        sudo apt-get install gfortran libopenblas-serial-dev
        wget https://github.com/NOAA-EMC/NCEPLIBS-ip/archive/refs/tags/v5.1.0.tar.gz
        tar -xzvf v5.1.0.tar.gz
        cd NCEPLIBS-ip-5.1.0
        mkdir build && cd build
        cmake -DOPENMP=ON -DBUILD_SHARED_LIBS=ON -DBLA_VENDOR=OpenBLAS ..
        make -j2
        sudo make install

    - name: Install and test with interpolation
      if: matrix.interp == 'on'
      run: |
        python -m pip install ".[test]" numcodecs fsspec hypothesis
        python -c "import grib2io; assert grib2io.has_interpolation is True"
        python -m pytest tests/

    - name: Install from a source distribution without NCEPLIBS-ip
      if: matrix.interp == 'off'
      run: |
        python -m pip install build uv
        workdir=$(mktemp -d)
        python -m build --sdist --outdir "$workdir"
        python -m venv "$workdir/pip-env"
        "$workdir/pip-env/bin/python" -m pip install "$workdir"/grib2io-*.tar.gz
        uv venv --python "$(command -v python)" "$workdir/uv-env"
        uv pip install --python "$workdir/uv-env/bin/python" "$workdir"/grib2io-*.tar.gz
        for installer in pip uv; do
          "$workdir/$installer-env/bin/python" tests/wheel_smoke.py tests/input_data --core-only
        done
