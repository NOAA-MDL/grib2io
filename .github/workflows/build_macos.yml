name: Build and Test on macOS

on: [push, pull_request]

jobs:
  build-macos:

    name: py${{ matrix.python-version }}_cc=${{ matrix.compiler }}_interp=${{ matrix.interp }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CC: ${{ matrix.compiler }}
    strategy:
      matrix:
        os: ["macos-latest",]
        compiler: ["gcc-14"]
        interp: ["on", "off"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install macOS Dependencies
      run: |
        brew install jasper libpng libaec
        brew trust eengl/nceplibs
        brew tap eengl/nceplibs
        brew install nceplibs-g2c
        echo "G2C_DIR=$(brew --prefix nceplibs-g2c)" >> $GITHUB_ENV

    - name: Install NCEPLIBS-ip
      if: matrix.interp == 'on'
      run: |
        brew install nceplibs-ip
        echo "IP_DIR=$(brew --prefix nceplibs-ip)" >> $GITHUB_ENV

    - name: Install and test with interpolation
      if: matrix.interp == 'on'
      run: |
        python -m pip install ".[test]" numcodecs fsspec hypothesis
        python -c "import grib2io; assert grib2io.has_interpolation is True"
        python -m pytest tests/

    - name: Install from a source distribution without NCEPLIBS-ip
      if: matrix.interp == 'off'
      run: |
        python -m pip install build uv
        workdir=$(mktemp -d)
        python -m build --sdist --outdir "$workdir"
        python -m venv "$workdir/pip-env"
        "$workdir/pip-env/bin/python" -m pip install "$workdir"/grib2io-*.tar.gz
        uv venv --python "$(command -v python)" "$workdir/uv-env"
        uv pip install --python "$workdir/uv-env/bin/python" "$workdir"/grib2io-*.tar.gz
        for installer in pip uv; do
          "$workdir/$installer-env/bin/python" tests/wheel_smoke.py tests/input_data --core-only
        done
